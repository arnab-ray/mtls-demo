services:
  postgresql:
    container_name: mtls-demo-postgresql
    image: postgres:14
    environment:
      POSTGRES_PASSWORD: lock
      POSTGRES_USER: demo
      POSTGRES_DB: mtls_poc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d mtls_poc"]
      interval: 10s
      timeout: 5s
      retries: 5
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mtls-demo
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/mtls_poc?currentSchema=public&sslmode=disable&reWriteBatchedInserts=true
      SPRING_DATASOURCE_USERNAME: demo
      SPRING_DATASOURCE_PASSWORD: lock
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
    ports:
      - "8080:8080"
    depends_on:
      postgresql:
        condition: service_healthy

volumes:
  postgres_data:
