# Expose the app through the Istio ingress gateway. Applied by setup.sh.
# setup.sh exposes the gateway service as a NodePort, so the app is reachable
# from the host at http://<minikube-ip>:<gateway-http-nodePort>/ with a
# `Host: mtls-demo.local` header (no kubectl port-forward or minikube tunnel).
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: mtls-demo-gateway
  namespace: mtls-demo
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "mtls-demo.local"
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: mtls-demo-app
  namespace: mtls-demo
spec:
  hosts:
    - "mtls-demo.local"
  gateways:
    - mtls-demo-gateway
  http:
    - route:
        - destination:
            host: mtls-demo-app.mtls-demo.svc.cluster.local
            port:
              number: 8080
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: mtls-demo-app-istio-mutual
  namespace: mtls-demo
spec:
  host: mtls-demo-app.mtls-demo.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
